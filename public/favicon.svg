<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="favLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="favArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="favSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle for contrast on all browser tab bars -->
  <rect width="48" height="48" rx="12" fill="#064e3b" />

  <g filter="url(#favShadow)">
    <!-- Left Sprout Leaf (Agriculture) -->
    <path
      d="M24 40.5C14.8 40.5 8.5 32.5 8.5 22C8.5 13.2 15 7.5 24 5.5C20.2 13.5 19 25 24 40.5Z"
      fill="url(#favLeafGrad)"
    />

    <!-- Dynamic Upward Growth Wing / Arrow (Pragati Progress) -->
    <path
      d="M24 5.5C28.8 9.5 38 16.8 39 26C39.8 33.2 34.5 39.5 25.5 40.5C29.2 32.2 29.5 21.8 24 16V5.5Z"
      fill="url(#favArrowGrad)"
      opacity="0.95"
    />

    <!-- Central Ascending Vector Accent -->
    <path
      d="M24 9.5L24 37"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-dasharray="1.5 3"
      opacity="0.85"
    />

    <!-- Golden Sun & Connected Technology Node -->
    <circle cx="35" cy="11.5" r="4" fill="url(#favSunGrad)" />
    <circle cx="35" cy="11.5" r="1.5" fill="#ffffff" opacity="0.9" />
  </g>
</svg>